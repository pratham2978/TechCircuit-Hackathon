services:
  # ─── BrandGuard Unified Web Service (Backend API + Frontend SPA) ─────────
  - type: web
    name: brandguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: GEMINI_API_KEY
        sync: false          # Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false   # Render injects PORT automatically
